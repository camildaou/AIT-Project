# Configuration for the separate 27-class single-label track (does not affect
# configs/default.yaml, configs/multilabel.yaml or any existing track).
# Loaded via `emotion_ait.single_label_27.config.load_single_label_27_config`.
#
# Raw data location and the 28 original label names come from
# configs/default.yaml; only this track's settings live here.

dataset_id: "goemotions-simplified/single-label-27/v1"

# Policy: keep an example iff its complete original label set is exactly one
# label and that label is not `neutral`. Multi-label, neutral-only and
# neutral+emotion examples are discarded (never projected to one class).
# Classes: the 27 emotions in original GoEmotions order (index 0..26).

splits: [train, validation, test]

paths:
  processed_dir: "data/processed/single_label_27"
  subsets_dir: "data/subsets/single_label_27_ladder"

sampling:
  # Proportional (Webster) stratification includes all 27 classes only from
  # n = 303 on (grief has 39 of 23,485 training examples), so the ladder
  # starts at 500. 23485 = the full training partition.
  ladder_sizes: [500, 1000, 2000, 4000, 8000, 12000, 16000, 23485]
  ladder_seeds: [42, 43, 44, 45, 46]
  require_all_classes: true

